<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CouscousMessage - Discussion</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button id="back-btn" class="icon-btn" title="Retour">←</button>
      <div class="app-header-avatar" id="conv-avatar">G</div>
      <div class="app-header-title">
        <h1 id="conv-title">Discussion</h1>
        <span id="conv-subtitle">Groupe ou MP</span>
      </div>
      <div class="app-header-actions">
        <button id="add-member-btn" class="icon-btn" title="Ajouter un membre"><h1>+</h1></button>
        <button id="hide-btn" class="icon-btn" title="Cacher pour quelqu'un">Cacher</button>
        <button id="unhide-btn" class="icon-btn" title="Décacher">Décacher</button>
      </div>
    </header>

    <main class="chat-page">
      <div id="messages"></div>

      <div id="input-zone">
        <input id="msg-input" type="text" placeholder="Message">
        <button id="send-btn">Envoyer</button>
      </div>
    </main>

    <!-- Popup ajout membre -->
    <div id="add-member-popup">
      <div class="popup-inner">
        <h3>Ajouter un membre</h3>
        <input id="member-search" type="text" placeholder="Tape un nom...">
        <div id="member-results"></div>
        <div style="margin-top:10px; text-align:right;">
          <button id="close-add-member-popup" class="btn">Fermer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Config Firebase -->
  <script src="../JS/firebase-config.js"></script>
  <!-- Logique chat -->
  <script src="../JS/chat.js"></script>
</body>
</html>
