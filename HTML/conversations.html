<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CouscousMessage - Conversations</title>
  <link rel="stylesheet" href="/CSS/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="app-header-avatar">CM</div>
      <div class="app-header-title">
        <h1>Conversations</h1>
        <span>Choisis une discussion ou crée-en une</span>
      </div>
      <div class="app-header-actions">
        <button id="logout-btn" class="icon-btn" title="Déconnexion">⏏</button>
      </div>
    </header>

    <main class="conversations-page">
      <div class="conversations-header-actions">
        <button id="new-mp-btn" class="btn btn-primary">Nouveau MP</button>
        <button id="create-group-btn" class="btn">Nouveau groupe</button>
      </div>

      <!-- Popup création MP -->
<div id="popup-mp" class="popup" style="display:none;">
  <div class="popup-inner">
    <h3>Nouveau message privé</h3>
    <input id="mp-search" type="text" placeholder="Tape un nom...">
    <div id="mp-results"></div>
    <button id="close-mp" class="btn">Fermer</button>
  </div>
</div>

<!-- Popup création groupe -->
<div id="popup-group" class="popup" style="display:none;">
  <div class="popup-inner">
    <h3>Nouveau groupe</h3>

    <input id="group-name-input" type="text" placeholder="Nom du groupe">

    <h4>Membres :</h4>
    <div id="group-selected" style="margin-bottom:10px;"></div>

    <input id="group-search" type="text" placeholder="Tape un nom...">
    <div id="group-results"></div>

    <button id="create-group-final" class="btn btn-primary">Créer le groupe</button>
    <button id="close-group" class="btn">Fermer</button>
  </div>
</div>


      <div style="padding:0 10px 8px;">
        <input id="new-member-id" type="text" placeholder="UID de l'autre utilisateur" style="width:100%; margin-bottom:6px; padding:8px; border-radius:10px; border:1px solid var(--border-subtle); background:var(--bg-input); color:var(--text-main);">
        <input id="group-name" type="text" placeholder="Nom du groupe" style="width:100%; margin-bottom:6px; padding:8px; border-radius:10px; border:1px solid var(--border-subtle); background:var(--bg-input); color:var(--text-main);">
        <input id="group-members" type="text" placeholder="UID des membres séparés par des virgules" style="width:100%; padding:8px; border-radius:10px; border:1px solid var(--border-subtle); background:var(--bg-input); color:var(--text-main);">
      </div>

      <div class="conversations-list" id="conversations-list"></div>
    </main>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <!-- Config Firebase -->
  <script src="../JS/firebase-config.js"></script>
  <!-- Logique conversations -->
  <script src="../JS/conversations.js"></script>
</body>
</html>
